<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDEO DE PROCESADORES</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #8e6995;
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        section {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            margin: 20px auto;
            max-width: 900px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        iframe {
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin: 10px 0;
            background-color: #ffffff;
            padding: 5px;
            width: 100%;
            max-width: 800px;
            height: 350px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            display: block;
            margin: 20px auto;
            background-color: #0055a5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #003f7f;
        }
    </style>
</head>
<body>
    <section>
        <h1>Video: ¿Cómo funciona un procesador?</h1>
        <p>Observemos los siguientes videos para comprender mejor cómo operan los procesadores y su importancia en la arquitectura de los computadores en nuestro uso diario.</p>

                title="YouTube video player"
                frameborder="0"

                allowfullscreen>
        </iframe>

        <iframe src="https://www.youtube.com/embed/bJrfPQJ_Ks4?si=R-ReYWcnhcs9VToW"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
        </iframe>

        <a href="index.html">
            <button>Volver al inicio</button>
        </a>
    </section>
</body>
</html>
